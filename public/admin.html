
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Auction House</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/admin.js" defer></script>
</head>
<body>
  <header>
    <a href="/">Auction House</a>
    <nav>
      <a href="/auctions.html">Auctions</a>
      <a href="/results.html">Results</a>
      <button id="logoutButton" type="button">Logout</button>
    </nav>
  </header>

  <main>
    <h1>Admin Dashboard</h1>
    <p class="muted">Overview of the auction platform.</p>
    <p id="message" role="status"></p>

    <section id="stats" class="grid">
      <article class="panel">
        <h2>Users</h2>
        <p id="userCount">—</p>
      </article>
      <article class="panel">
        <h2>Total Auctions</h2>
        <p id="auctionCount">—</p>
      </article>
      <article class="panel">
        <h2>Open Auctions</h2>
        <p id="openAuctionCount">—</p>
      </article>
      <article class="panel">
        <h2>Total Bids</h2>
        <p id="bidCount">—</p>
      </article>
    </section>

    <button id="refreshButton" type="button">Refresh Statistics</button>
  </main>
</body>
</html>
